<div class="form-row">
  <label class="form-label">API Key</label>
  <div style="position:relative">
    <input type="text"
           class="form-input"
           id="s_talksasa_api_key"
           value="<?= htmlspecialchars($settings['talksasa_api_key'] ?? '') ?>"
           placeholder="Talk Sasa API key"
           style="padding-right:44px;font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;">
    <button type="button"
            id="toggleApiKey"
            title="Show / hide API key"
            onclick="
              var f = document.getElementById('s_talksasa_api_key');
              var b = document.getElementById('toggleApiKeyIcon');
              if (f.type === 'text') {
                f.type = 'password';
                b.className = 'fas fa-eye';
              } else {
                f.type = 'text';
                b.className = 'fas fa-eye-slash';
              }
            "
            style="position:absolute;right:0;top:0;height:100%;width:40px;
                   border:none;background:transparent;cursor:pointer;
                   color:var(--text-3);display:flex;align-items:center;
                   justify-content:center;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
                   transition:color .15s;">
      <i class="fas fa-eye" id="toggleApiKeyIcon"></i>
    </button>
  </div>
  <div class="form-hint">Visible so you can verify the key. Hide it again with the eye button.</div>
</div>
